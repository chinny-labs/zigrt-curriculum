  - {id: count-to-100, title: "Counting to 100", grade: K, strand: place-value, requires: [count-by-tens], standards: [K.CC.A.1]}
  - {id: add-within-5, title: "Adding to 5", grade: K, strand: add-sub, requires: [count-on-from], standards: [K.OA.A.5], needs: [dots]}
  - {id: sub-within-5, title: "Taking away to 5", grade: K, strand: add-sub, requires: [add-within-5], standards: [K.OA.A.5], needs: [dots]}
  - {id: add-within-10, title: "Adding to 10", grade: K, strand: add-sub, requires: [add-within-5], standards: [K.OA.A.5]}
  - {id: sub-within-10, title: "Taking away to 10", grade: K, strand: add-sub, requires: [add-within-10, sub-within-5], standards: [K.OA.A.5]}
