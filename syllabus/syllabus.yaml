# Figures and inputs the syllabus needs that the app does not draw yet. Each
# is app work (the figure catalogue, Apache-2.0) to do before the grade that
# first needs it.
needs:
  dots: Loose dots or objects to count, in a row, a group or scattered
  ten-frame: A ten frame (or two) with counters
  base-ten: Hundreds flats, tens rods and ones cubes
  compare-pictures: Two or three objects of different length, height or weight
  shapes: A named flat shape (triangle, square, rectangle, circle, hexagon, trapezoid, rhombus, parallelogram, pentagon), possibly cut into parts or with a symmetry line
  solids: A cube, cone, cylinder, sphere or box
  scenes: A small picture of things above, below, beside, in front of or behind
  ruler: An object beside a ruler in units, inches or centimetres
  table: A small table or tally chart
  picture-graph: A picture graph with a key
  bar-graph: A bar graph with a scale
  line-plot: A line plot with Xs over whole numbers or fractions
  coins: Pennies, nickels, dimes and quarters
  scales: A balance or kitchen scale, and a jug with a scale
  split-rectangle: A rectangle split into labelled parts (area models)
  polygon: A rectilinear shape with labelled sides
  number-line-decimal: A number line marked in tenths or hundredths
  lines: Points, lines, rays and segments, parallel or perpendicular
  angle: An angle drawn at a given size
  protractor: An angle on a protractor
  joined-prisms: Two boxes joined together, with edges labelled
