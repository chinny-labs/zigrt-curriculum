  - {id: compare-measures, title: "Longer, taller or heavier", grade: K, strand: measurement, requires: [count-objects], standards: [K.MD.A.1, K.MD.A.2], needs: [compare-pictures]}
  - {id: sort-and-count, title: "Sorting and counting", grade: K, strand: measurement, requires: [compare-groups], standards: [K.MD.B.3], needs: [dots]}
  - {id: name-flat-shapes, title: "Flat shapes", grade: K, strand: geometry, requires: [count-objects], standards: [K.G.A.2], needs: [shapes]}
  - {id: shape-positions, title: "Above, below and beside", grade: K, strand: geometry, requires: [name-flat-shapes], standards: [K.G.A.1], needs: [scenes]}
