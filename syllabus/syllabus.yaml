# The K-5 syllabus (plan 4.4): every topic the finished pack will have, with
# its place in the graph. Lessons are written grade by grade; a topic here
# moves into topics.yaml (with its lesson in topics/) when it is written, and
# keeps its ID, grade, strand and edges. syllabus_test.go checks the graph.
#
# Fields: id, title (student-facing), grade, strand, requires, standards
# (Common Core, shown to parents), needs (figures or inputs the app does not
# draw yet; see the list at the end).

topics:
  # --- Kindergarten -----------------------------------------------------------
  - {id: count-objects, title: "Counting dots", grade: K, strand: place-value, standards: [K.CC.B.5]}
  - {id: numbers-to-10, title: "Reading numbers to 10", grade: K, strand: place-value, requires: [count-objects], standards: [K.CC.A.3], needs: [dots]}
  - {id: count-on-from, title: "Counting on", grade: K, strand: place-value, requires: [numbers-to-10], standards: [K.CC.A.2]}
  - {id: one-more-one-less, title: "One more and one less", grade: K, strand: place-value, requires: [count-on-from], standards: [K.CC.B.4c]}
  - {id: compare-groups, title: "Which group has more", grade: K, strand: place-value, requires: [count-objects], standards: [K.CC.C.6], needs: [dots]}
  - {id: count-to-20, title: "Counting to 20", grade: K, strand: place-value, requires: [numbers-to-10], standards: [K.CC.B.5], needs: [ten-frame]}
  - {id: compare-numbers-20, title: "Bigger or smaller", grade: K, strand: place-value, requires: [compare-groups, count-to-20], standards: [K.CC.C.7]}
