id: add-within-20
kps:
  - id: add-within-20.kp1
    explain: >-
      Make a ten first. Then add what is left over.
    templates:
      - id: add-within-20.kp1.t1
        vars:
          a: {int: [6, 9]}
          b: {int: [11 - a, 9]}
        prompt: "{a} + {b}"
        layout: across
        op: "+"
        parts: [a, b]
        answer: {type: integer, value: a + b}
        min_variety: 26
        solution:
          - "{a} needs {10 - a} more to make 10."
          - "Take {10 - a} from {b}. That leaves {b - 10 + a}."
          - "10 + {b - 10 + a} = {a + b}"
          - "{a} + {b} = {a + b}"
  - id: add-within-20.kp2
    explain: >-
      If you know a fact, use it. Doubles like 7 + 7 help with 7 + 8.
    templates:
      - id: add-within-20.kp2.t1
        vars:
          a: {int: [2, 10]}
          b: {int: [2, 10]}
        prompt: "{a} + {b}"
        layout: across
        op: "+"
        parts: [a, b]
        answer: {type: integer, value: a + b}
        solution:
          - when: a == b + 1 || b == a + 1
            text: "{min(a, b)} + {min(a, b)} = {2 * min(a, b)}, and one more is {a + b}."
          - "{a} + {b} = {a + b}"
