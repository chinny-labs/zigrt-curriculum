id: fact-families-20
kps:
  - id: fact-families-20.kp1
    explain: >-
      Three numbers make a family. One adding fact gives you a taking away fact.
    templates:
      - id: fact-families-20.kp1.t1
        vars:
          a: {int: [2, 9]}
          b: {int: [2, 11]}
          s: a + b
        where: ["s <= 20"]
        prompt: "{a} + {b} = {s}. So what is {s} − {a}?"
        answer: {type: integer, value: b}
        solution:
          - "{a}, {b} and {s} are a family."
          - "{s} − {a} = {b}"
  - id: fact-families-20.kp2
    explain: >-
      To take away, think of adding. What adds on to make the big number?
    templates:
      - id: fact-families-20.kp2.t1
        vars:
          s: {int: [11, 18]}
          a: {int: [2, 9]}
        where: ["s - a >= 2 && s - a <= 9"]
        prompt: "{s} − {a}"
        layout: across
        op: "-"
        parts: [s, a]
        answer: {type: integer, value: s - a}
        solution:
          - "Think: {a} + ? = {s}."
          - "{a} + {s - a} = {s}, so {s} − {a} = {s - a}."
