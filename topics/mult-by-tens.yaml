id: mult-by-tens
kps:
  - id: mult-by-tens.kp1
    explain: >-
      4 × 30 is 4 × 3 tens, which is 12 tens, or 120.
    templates:
      - id: mult-by-tens.kp1.t1
        vars:
          a: {int: [2, 9]}
          b: {int: [2, 9]}
        prompt: "{a} × {10 * b}"
        layout: across
        op: "*"
        parts: [a, 10 * b]
        answer:
          type: choice
          right: "{10 * a * b}"
          distractors: ["{a * b}", "{100 * a * b}"]
        min_variety: 50
        solution:
          - "{a} × {b} = {a * b}, so {a} × {b} tens = {a * b} tens."
          - "{a} × {10 * b} = {10 * a * b}"
