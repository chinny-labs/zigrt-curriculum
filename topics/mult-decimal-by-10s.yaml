id: mult-decimal-by-10s
kps:
  - id: mult-decimal-by-10s.kp1
    explain: >-
      Times 10 moves each digit one place left, so the point seems to jump one place right.
    templates:
      - id: mult-decimal-by-10s.kp1.t1
        vars:
          n: {int: [101, 9999]}
          x: n / 1000
          k: {int: [0, 2]}
          p: "pick(k, 10, 100, 1000)"
        prompt: "{dec(x, 3)} × {group(p)}"
        answer:
          type: choice
          right: "{dec(x * p)}"
          distractors: ["{dec(x * p / 10)}", "{dec(x * p * 10)}"]
        solution:
          - "Move each digit {k + 1} {plural(k + 1, 'place', 'places')} to the left."
          - "{dec(x, 3)} × {group(p)} = {dec(x * p)}"
