id: whole-numbers-as-fractions
kps:
  - id: whole-numbers-as-fractions.kp1
    explain: >-
      When the top and bottom are the same, every part is shaded. That is one whole.
    templates:
      - id: whole-numbers-as-fractions.kp1.t1
        vars:
          d: {int: [2, 8]}
          k: {int: [1, 4]}
        prompt: "{k * d}/{d} is how many wholes?"
        answer: {type: integer, value: k}
        min_variety: 28
        solution:
          - "{d}/{d} makes one whole."
          - "{k * d}/{d} is {k} {plural(k, 'whole', 'wholes')}."
  - id: whole-numbers-as-fractions.kp2
    explain: >-
      A whole number can be written over 1. 3 is 3/1.
    templates:
      - id: whole-numbers-as-fractions.kp2.t1
        vars:
          k: {int: [2, 9]}
        prompt: "Which fraction is equal to {k}?"
        answer:
          type: choice
          right: "{k}/1"
          distractors: ["1/{k}", "{k}/{k}"]
        min_variety: 8
        solution:
          - "{k} wholes, each in one part, is {k}/1."
