id: coordinate-pictures
kps:
  - id: coordinate-pictures.kp1
    explain: >-
      A graph can show something real. Read across to the first number, then up to the second.
    templates:
      - id: coordinate-pictures.kp1.t1
        vars:
          k: {int: [2, 3]}
          c: {int: [0, 2]}
          x: {int: [1, 3]}
        prompt: "Each point shows hours worked (across) and dollars earned (up). How many dollars are earned for {x} {plural(x, 'hour', 'hours')}?"
        layout: figure
        figure: plot
        figure_args: {size: 12, points: "join('0,', text(c), '|1,', text(k + c), '|2,', text(2 * k + c), '|3,', text(3 * k + c))", join: 1}
        answer: {type: integer, value: k * x + c}
        min_variety: 18
        solution:
          - "Find {x} across, then read up: {k * x + c}."
  - id: coordinate-pictures.kp2
    explain: >-
      Points on a straight line follow a rule. Use the rule to find the next point.
    templates:
      - id: coordinate-pictures.kp2.t1
        vars:
          k: {int: [1, 3]}
          c: {int: [0, 2]}
        prompt: "The points follow a rule. If the line goes on, what is the second number when the first is 4?"
        layout: figure
        figure: plot
        figure_args: {size: 15, points: "join('0,', text(c), '|1,', text(k + c), '|2,', text(2 * k + c), '|3,', text(3 * k + c))", join: 1}
        answer: {type: integer, value: 4 * k + c}
        min_variety: 9
        solution:
          - "Each step across goes up {k}."
          - "From (3, {3 * k + c}), one more step: (4, {4 * k + c}). So the answer is {4 * k + c}."
