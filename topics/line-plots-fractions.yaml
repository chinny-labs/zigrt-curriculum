id: line-plots-fractions
kps:
  - id: line-plots-fractions.kp1
    explain: >-
      The marks between whole numbers are halves or quarters. Count the Xs over a mark.
    templates:
      - id: line-plots-fractions.kp1.t1
        vars:
          a: {int: [1, 4]}
          b: {int: [1, 4]}
          c: {int: [1, 4]}
          d: {int: [1, 4]}
          k: {int: [0, 3]}
          len: "pick(k, '1', '1½', '2', '2½')"
        prompt: "Leaves were measured in inches. How many leaves are {len} inches long?"
        layout: figure
        figure: line-plot
        figure_args: {from: 0, to: 3, step: 1/2, marks: "join('1:', text(a), '|3/2:', text(b), '|2:', text(c), '|5/2:', text(d))"}
        answer: {type: integer, value: "pick(k, a, b, c, d)"}
        solution:
          - "Count the Xs over {len}."
          - "{pick(k, a, b, c, d)} {plural(pick(k, a, b, c, d), 'leaf is', 'leaves are')} {len} inches long."
  - id: line-plots-fractions.kp2
    explain: >-
      To find how many in all, add the Xs over every mark.
    templates:
      - id: line-plots-fractions.kp2.t1
        vars:
          a: {int: [1, 4]}
          b: {int: [1, 4]}
          c: {int: [1, 4]}
        prompt: "Worms were measured in inches. How many worms were measured in all?"
        layout: figure
        figure: line-plot
        figure_args: {from: 1, to: 3, step: 1/4, marks: "join('5/4:', text(a), '|2:', text(b), '|11/4:', text(c))"}
        answer: {type: integer, value: a + b + c}
        solution:
          - "{a} + {b} + {c} = {a + b + c}"
