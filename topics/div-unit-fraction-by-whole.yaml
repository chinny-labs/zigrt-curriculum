id: div-unit-fraction-by-whole
kps:
  - id: div-unit-fraction-by-whole.kp1
    explain: >-
      1/3 ÷ 2 shares a third into 2 equal parts. Each part is 1/6.
    templates:
      - id: div-unit-fraction-by-whole.kp1.t1
        vars:
          a: {int: [2, 8]}
          n: {int: [2, 6]}
        prompt: "1/{a} ÷ {n}"
        answer: {type: fraction, value: 1 / (a * n)}
        min_variety: 35
        solution:
          - "Split 1/{a} into {n} equal parts."
          - "1/{a} ÷ {n} = 1/{a * n}"
