id: patterns-two-rules
kps:
  - id: patterns-two-rules.kp1
    explain: >-
      Two patterns with rules side by side: each step, apply each rule. Compare the terms at each step.
    templates:
      - id: patterns-two-rules.kp1.t1
        vars:
          a: {int: [2, 5]}
          k: {int: [2, 4]}
          b: k * a
          n: {int: [3, 6]}
        prompt: "Pattern A starts at 0 and adds {a}. Pattern B starts at 0 and adds {b}. When A is {n * a}, what is B?"
        answer: {type: integer, value: n * b}
        solution:
          - "{n * a} is step {n} of pattern A."
          - "Step {n} of pattern B is {n} × {b} = {n * b}."
  - id: patterns-two-rules.kp2
    explain: >-
      Pairs from the two patterns make points. Each point's second number is always the same times its first.
    templates:
      - id: patterns-two-rules.kp2.t1
        vars:
          k: {int: [2, 3]}
          s: {int: [1, 3]}
        prompt: "These points come from two patterns. Which point is next?"
        layout: figure
        figure: plot
        figure_args: {size: 20, points: "join('0,0|', text(s), ',', text(k * s), '|', text(2 * s), ',', text(2 * k * s))", join: 1}
        min_variety: 6
        answer:
          type: choice
          right: "({3 * s}, {3 * k * s})"
          distractors: ["({3 * k * s}, {3 * s})", "({3 * s}, {2 * k * s + 1})"]
        solution:
          - "The second number is always {k} times the first."
          - "Next: ({3 * s}, {3 * k * s})."
