id: name-flat-shapes
kps:
  - id: name-flat-shapes.kp1
    explain: >-
      A shape keeps its name when you turn it.
    templates:
      - id: name-flat-shapes.kp1.t1
        vars:
          k: {int: [0, 4]}
          name: "pick(k, 'circle', 'triangle', 'square', 'rectangle', 'hexagon')"
          turn: {choose: [0, 15, 30, 45, 60, 90, 120, 160, 200]}
        prompt: "What shape is this?"
        layout: figure
        figure: shape
        figure_args: {name: name, turn: turn}
        answer:
          type: choice
          right: "{name}"
          distractors:
            - "{pick(k, 'hexagon', 'square', 'rectangle', 'square', 'circle')}"
            - "{pick(k, 'square', 'rectangle', 'triangle', 'triangle', 'triangle')}"
        solution:
          - "{pick(k, 'It is round with no corners.', 'It has 3 sides.', 'It has 4 sides, all the same.', 'It has 4 sides, two long and two short.', 'It has 6 sides.')}"
          - "It is a {name}."
  - id: name-flat-shapes.kp2
    explain: >-
      Count the straight sides to help name a shape.
    templates:
      - id: name-flat-shapes.kp2.t1
        vars:
          k: {int: [0, 3]}
          name: "pick(k, 'triangle', 'square', 'rectangle', 'hexagon')"
          turn: {choose: [0, 20, 45, 90, 135]}
        prompt: "How many straight sides does this shape have?"
        layout: figure
        figure: shape
        figure_args: {name: name, turn: turn}
        answer: {type: integer, value: "pick(k, 3, 4, 4, 6)"}
        min_variety: 20
        solution:
          - "Touch each side once as you count."
          - "A {name} has {pick(k, 3, 4, 4, 6)} sides."
