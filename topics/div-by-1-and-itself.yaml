id: div-by-1-and-itself
kps:
  - id: div-by-1-and-itself.kp1
    explain: >-
      A number divided by 1 is itself. A number divided by itself is 1. Zero divided by any number is 0.
    templates:
      - id: div-by-1-and-itself.kp1.t1
        vars:
          a: {int: [2, 50]}
          k: {int: [0, 2]}
          x: "pick(k, a, a, 0)"
          y: "pick(k, 1, a, a)"
        prompt: "{x} ÷ {y}"
        layout: across
        op: "/"
        parts: [x, y]
        answer: {type: integer, value: x / y}
        solution:
          - "{pick(k, 'Sharing into 1 group keeps the whole amount.', 'Sharing a number into that many groups gives 1 each.', 'Sharing nothing gives 0 each.')}"
          - "{x} ÷ {y} = {x / y}"
