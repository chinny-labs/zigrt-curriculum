id: count-to-1000
kps:
  - id: count-to-1000.kp1
    explain: >-
      After 9 ones, the tens go up. After 9 tens, the hundreds go up.
    templates:
      - id: count-to-1000.kp1.t1
        vars:
          h: {int: [1, 9]}
          t: {choose: [9, 9, 3, 6]}
          o: {choose: [9, 9, 4, 7]}
          n: 100 * h + 10 * t + o
        where: ["n < 1000"]
        prompt: "What number comes after {n}?"
        answer: {type: integer, value: n + 1}
        solution:
          - "{o == 9 && t == 9 ? 'The ones and tens are full, so the hundreds go up.' : o == 9 ? 'The ones are full, so the tens go up.' : 'The ones go up by one.'}"
          - "After {n} comes {n + 1}."
  - id: count-to-1000.kp2
    explain: >-
      The number before is one less. Count back one.
    templates:
      - id: count-to-1000.kp2.t1
        vars:
          h: {int: [1, 9]}
          t: {choose: [0, 0, 4]}
          o: {choose: [0, 0, 5]}
          n: 100 * h + 10 * t + o
        prompt: "What number comes just before {n}?"
        answer: {type: integer, value: n - 1}
        min_variety: 27
        solution:
          - "Count back one from {n}."
          - "Just before {n} is {n - 1}."
