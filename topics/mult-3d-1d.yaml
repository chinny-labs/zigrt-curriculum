id: mult-3d-1d
kps:
  - id: mult-3d-1d.kp1
    explain: >-
      Multiply the ones, then the tens, then the hundreds. Carry into the next place each time.
    templates:
      - id: mult-3d-1d.kp1.t1
        vars:
          a: {int: [102, 999]}
          b: {int: [2, 9]}
        prompt: "{a} × {b}"
        layout: stacked
        op: "*"
        parts: [a, b]
        answer: {type: integer, value: a * b}
        solution:
          - "{100 * (a // 100)} × {b} = {100 * (a // 100) * b}, {10 * digit(a, 10)} × {b} = {10 * digit(a, 10) * b}, {a % 10} × {b} = {(a % 10) * b}."
          - "{a} × {b} = {group(a * b)}"
