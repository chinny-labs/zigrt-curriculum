id: fractions-as-decimals
kps:
  - id: fractions-as-decimals.kp1
    explain: >-
      Make the bottom 10, 100 or 1000, and the fraction reads as a decimal. 3/4 = 75/100 = 0.75.
    templates:
      - id: fractions-as-decimals.kp1.t1
        vars:
          d: {choose: [2, 4, 5, 20, 25, 50]}
          n: {int: [1, d - 1]}
        where: ["gcd(n, d) == 1"]
        prompt: "Write {n}/{d} as a decimal."
        answer: {type: decimal, value: n / d}
        solution:
          - "{n}/{d} = {n * 100 / d}/100"
          - "That is {dec(n / d)}."
      - id: fractions-as-decimals.kp1.t2
        vars:
          n: {choose: [1, 3, 5, 7]}
        prompt: "Write {n}/8 as a decimal."
        answer: {type: decimal, value: n / 8}
        min_variety: 4
        solution:
          - "1/8 = 0.125, so {n}/8 = {n} × 0.125."
          - "That is {dec(n / 8)}."
