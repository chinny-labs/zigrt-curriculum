id: convert-units-decimals
kps:
  - id: convert-units-decimals.kp1
    explain: >-
      Metric units go up in tens, hundreds and thousands. Converting just moves the point.
    templates:
      - id: convert-units-decimals.kp1.t1
        vars:
          m: {int: [11, 99]}
          x: m / 10
          k: {int: [0, 2]}
          big: "pick(k, 'm', 'kg', 'litres')"
          small: "pick(k, 'cm', 'g', 'ml')"
          f: "pick(k, 100, 1000, 1000)"
        prompt: "{dec(x)} {big} = ? {small}"
        answer: {type: integer, value: x * f}
        solution:
          - "1 {k == 2 ? 'litre' : big} = {group(f)} {small}."
          - "{dec(x)} × {group(f)} = {group(x * f)} {small}"
  - id: convert-units-decimals.kp2
    explain: >-
      Going to a bigger unit, divide: 350 g is 0.35 kg.
    templates:
      - id: convert-units-decimals.kp2.t1
        vars:
          n: {int: [105, 4950]}
          k: {int: [0, 1]}
          big: "pick(k, 'kg', 'km')"
          small: "pick(k, 'g', 'm')"
        where: ["n % 5 == 0"]
        prompt: "{group(n)} {small} = ? {big}"
        answer: {type: decimal, value: n / 1000}
        solution:
          - "1,000 {small} = 1 {big}."
          - "{group(n)} ÷ 1,000 = {dec(n / 1000)} {big}"
