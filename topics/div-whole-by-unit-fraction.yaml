id: div-whole-by-unit-fraction
kps:
  - id: div-whole-by-unit-fraction.kp1
    explain: >-
      4 ÷ 1/3 asks how many thirds are in 4. Each whole has 3 thirds, so 4 × 3 = 12.
    templates:
      - id: div-whole-by-unit-fraction.kp1.t1
        vars:
          n: {int: [2, 9]}
          a: {int: [2, 8]}
        prompt: "{n} ÷ 1/{a}"
        answer: {type: integer, value: n * a}
        solution:
          - "Each whole holds {a} pieces of 1/{a}."
          - "{n} × {a} = {n * a}"
