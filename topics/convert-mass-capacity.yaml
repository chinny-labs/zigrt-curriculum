id: convert-mass-capacity
kps:
  - id: convert-mass-capacity.kp1
    explain: >-
      1 kg = 1,000 g and 1 litre = 1,000 ml. Multiply to get the smaller unit.
    templates:
      - id: convert-mass-capacity.kp1.t1
        vars:
          n: {int: [2, 12]}
          k: {int: [0, 1]}
          big: "pick(k, 'kg', 'litres')"
          small: "pick(k, 'g', 'ml')"
        prompt: "{n} {big} = ? {small}"
        answer: {type: integer, value: 1000 * n}
        min_variety: 22
        solution:
          - "1 {k == 0 ? 'kg' : 'litre'} = 1,000 {small}."
          - "{n} × 1,000 = {group(1000 * n)} {small}"
  - id: convert-mass-capacity.kp2
    explain: >-
      Half a kilogram is 500 g. A mixed amount is the wholes plus the rest.
    templates:
      - id: convert-mass-capacity.kp2.t1
        vars:
          n: {int: [1, 6]}
          r: {int: [1, 9]}
          k: {int: [0, 1]}
          big: "pick(k, 'kg', 'litres')"
          small: "pick(k, 'g', 'ml')"
        prompt: "{n} {big} {100 * r} {small} = ? {small}"
        answer: {type: integer, value: 1000 * n + 100 * r}
        solution:
          - "{n} {big} = {group(1000 * n)} {small}."
          - "{group(1000 * n)} + {100 * r} = {group(1000 * n + 100 * r)} {small}"
