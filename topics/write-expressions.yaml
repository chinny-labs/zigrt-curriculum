id: write-expressions
kps:
  - id: write-expressions.kp1
    explain: >-
      Words like "then" and "the sum of" show what to do first. Use brackets to do it first.
    templates:
      - id: write-expressions.kp1.t1
        vars:
          a: {int: [2, 12]}
          b: {int: [2, 12]}
          c: {int: [2, 9]}
        where: ["a != b"]
        prompt: "Which expression means: add {a} and {b}, then multiply by {c}?"
        answer:
          type: choice
          right: "({a} + {b}) × {c}"
          distractors: ["{a} + {b} × {c}", "{a} + ({b} × {c})"]
        solution:
          - "The adding happens first, so it goes in brackets."
          - "So the expression is ({a} + {b}) × {c}."
  - id: write-expressions.kp2
    explain: >-
      3 × (8 + 5) is three times as big as 8 + 5. You can tell without working it out.
    templates:
      - id: write-expressions.kp2.t1
        vars:
          k: {int: [2, 9]}
          a: {int: [10, 99]}
          b: {int: [10, 99]}
        prompt: "{k} × ({a} + {b}) is how many times as big as {a} + {b}?"
        answer: {type: integer, value: k}
        solution:
          - "It is {k} groups of ({a} + {b})."
          - "So it is {k} times as big."
