id: convert-time
kps:
  - id: convert-time.kp1
    explain: >-
      1 hour = 60 minutes, 1 minute = 60 seconds, 1 day = 24 hours.
    templates:
      - id: convert-time.kp1.t1
        vars:
          n: {int: [2, 9]}
          k: {int: [0, 2]}
          big: "pick(k, 'hours', 'minutes', 'days')"
          small: "pick(k, 'minutes', 'seconds', 'hours')"
          f: "pick(k, 60, 60, 24)"
        prompt: "{n} {big} = ? {small}"
        answer: {type: integer, value: n * f}
        min_variety: 24
        solution:
          - "Each of the {big} is {f} {small}."
          - "{n} × {f} = {n * f} {small}"
  - id: convert-time.kp2
    explain: >-
      To add times, add the minutes. 60 minutes or more make another hour.
    templates:
      - id: convert-time.kp2.t1
        vars:
          h: {int: [1, 3]}
          m: {int: [10, 55]}
        prompt: "{h} hours {m} minutes = ? minutes"
        answer: {type: integer, value: 60 * h + m}
        solution:
          - "{h} hours = {60 * h} minutes."
          - "{60 * h} + {m} = {60 * h + m} minutes"
