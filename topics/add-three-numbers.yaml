id: add-three-numbers
kps:
  - id: add-three-numbers.kp1
    explain: >-
      Add two numbers first. Then add the third one.
    templates:
      - id: add-three-numbers.kp1.t1
        vars:
          a: {int: [1, 9]}
          b: {int: [1, 9]}
          c: {int: [1, 9]}
        where: ["a + b + c <= 20"]
        prompt: "{a} + {b} + {c}"
        answer: {type: integer, value: a + b + c}
        solution:
          - "{a} + {b} = {a + b}"
          - "{a + b} + {c} = {a + b + c}"
  - id: add-three-numbers.kp2
    explain: >-
      Look for two numbers that make 10. Add those first.
    templates:
      - id: add-three-numbers.kp2.t1
        vars:
          a: {int: [1, 9]}
          b: {int: [1, 9]}
          c: 10 - a
        prompt: "{a} + {b} + {c}"
        answer: {type: integer, value: 10 + b}
        min_variety: 50
        solution:
          - "{a} and {c} make 10."
          - "10 + {b} = {10 + b}"
