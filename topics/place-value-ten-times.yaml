id: place-value-ten-times
kps:
  - id: place-value-ten-times.kp1
    explain: >-
      Ten of one place make one of the next place to the left. Ten hundreds make a thousand.
    templates:
      - id: place-value-ten-times.kp1.t1
        vars:
          k: {int: [2, 9]}
          j: {int: [0, 2]}
          big: "pick(j, 'hundreds', 'thousands', 'ten thousands')"
          small: "pick(j, 'tens', 'hundreds', 'thousands')"
        prompt: "How many {small} are in {k} {big}?"
        answer: {type: integer, value: 10 * k}
        min_variety: 24
        solution:
          - "Each of the {big} is ten {small}."
          - "{k} × 10 = {10 * k} {small}."
  - id: place-value-ten-times.kp2
    explain: >-
      The same digit one place to the left is worth ten times as much.
    templates:
      - id: place-value-ten-times.kp2.t1
        vars:
          d: {int: [1, 9]}
          k: {int: [0, 2]}
          n: "pick(k, 110 * d, 1100 * d, 11000 * d)"
          lo: "pick(k, 10 * d, 100 * d, 1000 * d)"
        prompt: "In {group(n)}, the first {d} is worth how many times the second {d}?"
        answer:
          type: choice
          right: "10 times"
          distractors: ["100 times", "the same"]
        min_variety: 27
        solution:
          - "The first {d} is worth {group(10 * lo)}. The second is worth {group(lo)}."
          - "{group(10 * lo)} is 10 times {group(lo)}."
