id: round-decimals
kps:
  - id: round-decimals.kp1
    explain: >-
      Look at the digit just right of the place you round to. 5 or more rounds up.
    templates:
      - id: round-decimals.kp1.t1
        vars:
          n: {int: [1001, 9999]}
          x: n / 1000
          k: {int: [0, 2]}
          p: "pick(k, 1, 1/10, 1/100)"
          name: "pick(k, 'whole number', 'tenth', 'hundredth')"
        where: ["n % 10 != 0"]
        prompt: "Round {dec(x, 3)} to the nearest {name}."
        answer: {type: decimal, value: "round(x, p)"}
        solution:
          - "Look at the {pick(k, 'tenths', 'hundredths', 'thousandths')} digit: {digit(x, p / 10)}."
          - "{dec(x, 3)} rounds to {dec(round(x, p))}."
