id: sub-tens
kps:
  - id: sub-tens.kp1
    explain: >-
      Take away tens like ones. 7 tens take away 3 tens is 4 tens.
    templates:
      - id: sub-tens.kp1.t1
        vars:
          a: {int: [2, 9]}
          b: {int: [1, 8]}
        where: ["b < a"]
        prompt: "{10 * a} − {10 * b}"
        layout: across
        op: "-"
        parts: [10 * a, 10 * b]
        answer: {type: integer, value: 10 * (a - b)}
        min_variety: 36
        solution:
          - "{a} tens − {b} tens = {a - b} tens."
          - "{10 * a} − {10 * b} = {10 * (a - b)}"
