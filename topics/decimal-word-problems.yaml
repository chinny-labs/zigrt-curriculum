id: decimal-word-problems
kps:
  - id: decimal-word-problems.kp1
    explain: >-
      Decimals in stories work like whole numbers. Line up the points and check the answer is sensible.
    templates:
      - id: decimal-word-problems.kp1.t1
        vars:
          n: {int: [3, 8]}
          c: {int: [125, 495]}
          p: c / 100
        prompt: "A notebook costs ${dec(p, 2)}. How much do {n} notebooks cost, in dollars?"
        answer: {type: decimal, value: n * p}
        solution:
          - "{n} × ${dec(p, 2)} = ${dec(n * p, 2)}"
      - id: decimal-word-problems.kp1.t2
        vars:
          a: {int: [105, 380]}
          b: {int: [105, 280]}
          x: a / 100
          y: b / 100
        prompt: "One ribbon is {dec(x, 2)} m and another is {dec(y, 2)} m. How many metres is that together?"
        answer: {type: decimal, value: x + y}
        solution:
          - "{dec(x, 2)} + {dec(y, 2)} = {dec(x + y)} m"
      - id: decimal-word-problems.kp1.t3
        vars:
          n: {int: [2, 6]}
          q: {int: [105, 450]}
          total: n * q / 100
        prompt: "{n} friends share a ${dec(total, 2)} bill equally. How many dollars does each pay?"
        answer: {type: decimal, value: q / 100}
        solution:
          - "${dec(total, 2)} ÷ {n} = ${dec(q / 100, 2)}"
