id: sub-through-10
kps:
  - id: sub-through-10.kp1
    explain: >-
      From a teen number, take away the ones to reach 10.
    templates:
      - id: sub-through-10.kp1.t1
        vars:
          o: {int: [1, 8]}
          a: 10 + o
        prompt: "{a} − {o}"
        layout: across
        op: "-"
        parts: [a, o]
        answer: {type: integer, value: 10}
        min_variety: 8
        solution:
          - "{a} is 10 and {o}. Take away the {o}."
          - "{a} − {o} = 10"
  - id: sub-through-10.kp2
    explain: >-
      Take away in two steps: down to 10, then the rest.
    templates:
      - id: sub-through-10.kp2.t1
        vars:
          a: {int: [11, 18]}
          b: {int: [3, 9]}
        where: ["b > a - 10", "a - b < 10"]
        prompt: "{a} − {b}"
        layout: across
        op: "-"
        parts: [a, b]
        answer: {type: integer, value: a - b}
        solution:
          - "Take away {a - 10} to get to 10."
          - "Take away {b - (a - 10)} more: {a - b}."
          - "{a} − {b} = {a - b}"
