id: word-problems-1000
kps:
  - id: word-problems-1000.kp1
    explain: >-
      Decide whether the story puts amounts together or finds what is left or different.
    templates:
      - id: word-problems-1000.kp1.t1
        vars:
          a: {int: [120, 560]}
          b: {int: [110, 430]}
        where: ["a + b <= 999"]
        prompt: "A library has {a} picture books and {b} chapter books. How many books is that in all?"
        answer: {type: integer, value: a + b}
        solution:
          - "In all means add."
          - "{a} + {b} = {a + b}"
      - id: word-problems-1000.kp1.t2
        vars:
          a: {int: [400, 999]}
          b: {int: [120, 390]}
        prompt: "A farm grew {a} pumpkins and sold {b}. How many pumpkins are left?"
        answer: {type: integer, value: a - b}
        solution:
          - "Selling takes some away."
          - "{a} − {b} = {a - b}"
      - id: word-problems-1000.kp1.t3
        vars:
          a: {int: [400, 999]}
          b: {int: [120, 390]}
        prompt: "One school has {a} children. Another has {b}. How many more children does the first school have?"
        answer: {type: integer, value: a - b}
        solution:
          - "How many more means find the difference."
          - "{a} − {b} = {a - b}"
