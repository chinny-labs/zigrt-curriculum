id: sub-fractions-same
kps:
  - id: sub-fractions-same.kp1
    explain: >-
      With the same bottom number, take away the tops. The bottom stays the same.
    templates:
      - id: sub-fractions-same.kp1.t1
        vars:
          d: {int: [3, 12]}
          a: {int: [2, d]}
          b: {int: [1, a - 1]}
        prompt: "{a}/{d} − {b}/{d}"
        answer:
          type: fraction
          value: (a - b) / d
          simplest: false
        solution:
          - "{a} − {b} = {a - b} parts of size 1/{d}."
          - "{a}/{d} − {b}/{d} = {a - b}/{d}"
