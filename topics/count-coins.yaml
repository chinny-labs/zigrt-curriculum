id: count-coins
kps:
  - id: count-coins.kp1
    explain: >-
      A dime is 10 cents and a penny is 1 cent. Count the dimes by tens,
      then count on the pennies.
    templates:
      - id: count-coins.kp1.t1
        vars:
          d: {int: [1, 9]}
          p: {int: [1, 9]}
        prompt: "{d} {plural(d, 'dime', 'dimes')} and {p} {plural(p, 'penny', 'pennies')}. How many cents?"
        answer: {type: integer, value: 10 * d + p}
        solution:
          - "{d} {plural(d, 'dime', 'dimes')} is {10 * d} cents."
          - "{10 * d} + {p} = {10 * d + p} cents."
  - id: count-coins.kp2
    explain: >-
      A quarter is 25 cents and a nickel is 5 cents. Start with the coin
      worth the most. Count on with each smaller coin.
    templates:
      - id: count-coins.kp2.t1
        vars:
          who: {words: [Mika, Theo, June, Ava, Sam]}
          q: {int: [1, 3]}
          d: {int: [1, 4]}
          n: {int: [1, 4]}
          total: 25 * q + 10 * d + 5 * n
        where:
          - total < 100
        prompt: "{who} has {q} {plural(q, 'quarter', 'quarters')}, {d} {plural(d, 'dime', 'dimes')} and {n} {plural(n, 'nickel', 'nickels')}. How many cents is that?"
        answer: {type: integer, value: total}
        solution:
          - "The {plural(q, 'quarter is', 'quarters are')} {25 * q} cents."
          - "The {plural(d, 'dime is', 'dimes are')} {10 * d} cents. The {plural(n, 'nickel is', 'nickels are')} {5 * n} cents."
          - "{25 * q} + {10 * d} + {5 * n} = {total} cents."
