id: line-plots-fraction-sums
kps:
  - id: line-plots-fraction-sums.kp1
    explain: >-
      Each X is one measurement. To find a total, add value times how many Xs, for each mark.
    templates:
      - id: line-plots-fraction-sums.kp1.t1
        vars:
          a: {int: [1, 3]}
          b: {int: [1, 3]}
          c: {int: [1, 3]}
          total: a / 4 + b / 2 + c * 3 / 4
        prompt: "Each X is a cup of water, in litres. If all the cups were poured into one jug, how many litres would it hold?"
        layout: figure
        figure: line-plot
        figure_args: {from: 0, to: 1, step: 1/4, marks: "join('1/4:', text(a), '|1/2:', text(b), '|3/4:', text(c))"}
        answer: {type: fraction, value: total, simplest: false}
        min_variety: 27
        solution:
          - "{a} × 1/4 + {b} × 1/2 + {c} × 3/4"
          - "That is {mixed(total)} litres."
