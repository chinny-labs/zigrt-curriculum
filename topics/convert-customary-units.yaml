id: convert-customary-units
kps:
  - id: convert-customary-units.kp1
    explain: >-
      1 yard = 3 feet, 1 foot = 12 inches, 1 pound = 16 ounces. Multiply to get the smaller unit.
    templates:
      - id: convert-customary-units.kp1.t1
        vars:
          n: {int: [2, 12]}
          k: {int: [0, 2]}
          big: "pick(k, 'yards', 'feet', 'pounds')"
          small: "pick(k, 'feet', 'inches', 'ounces')"
          f: "pick(k, 3, 12, 16)"
        prompt: "{n} {big} = ? {small}"
        answer: {type: integer, value: n * f}
        min_variety: 33
        solution:
          - "Each of the {big} is {f} {small}."
          - "{n} × {f} = {n * f} {small}"
  - id: convert-customary-units.kp2
    explain: >-
      Going to a bigger unit, divide. What is left over stays in the smaller unit.
    templates:
      - id: convert-customary-units.kp2.t1
        vars:
          q: {int: [2, 6]}
          r: {int: [1, 11]}
          n: 12 * q + r
        prompt: "{n} inches is how many feet and inches?"
        answer:
          type: choice
          right: "{q} feet {r} inches"
          distractors: ["{q + 1} feet {r} inches", "{n // 10} feet {n % 10} inches"]
        solution:
          - "{n} ÷ 12 = {q} r {r}."
          - "So it is {q} feet {r} inches."
