id: div-decimal-by-10s
kps:
  - id: div-decimal-by-10s.kp1
    explain: >-
      Dividing by 10 moves each digit one place right, so the number gets ten times smaller.
    templates:
      - id: div-decimal-by-10s.kp1.t1
        vars:
          n: {int: [11, 9999]}
          x: n / 10
          k: {int: [0, 2]}
          p: "pick(k, 10, 100, 1000)"
        prompt: "{dec(x)} ÷ {group(p)}"
        answer: {type: decimal, value: x / p}
        solution:
          - "Move each digit {k + 1} {plural(k + 1, 'place', 'places')} to the right."
          - "{dec(x)} ÷ {group(p)} = {dec(x / p)}"
