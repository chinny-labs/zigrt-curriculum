id: count-sides-corners
kps:
  - id: count-sides-corners.kp1
    explain: >-
      A corner is where two sides meet. Touch each corner once.
    templates:
      - id: count-sides-corners.kp1.t1
        vars:
          k: {int: [0, 4]}
          name: "pick(k, 'triangle', 'square', 'rectangle', 'pentagon', 'hexagon')"
          n: pick(k, 3, 4, 4, 5, 6)
          turn: {choose: [0, 25, 50, 90, 140, 210]}
        prompt: "How many corners does this shape have?"
        layout: figure
        figure: shape
        figure_args: {name: name, turn: turn}
        answer: {type: integer, value: n}
        min_variety: 25
        solution:
          - "Start at one corner. Go around and count."
          - "It has {n} corners."
  - id: count-sides-corners.kp2
    explain: >-
      A shape has as many sides as corners.
    templates:
      - id: count-sides-corners.kp2.t1
        vars:
          k: {int: [0, 4]}
          name: "pick(k, 'triangle', 'square', 'rectangle', 'pentagon', 'hexagon')"
          n: pick(k, 3, 4, 4, 5, 6)
        prompt: "This shape has {n} corners. How many sides does it have?"
        layout: figure
        figure: shape
        figure_args: {name: name, turn: 0}
        answer: {type: integer, value: n}
        min_variety: 5
        solution:
          - "Each side goes from one corner to the next."
          - "{n} corners, {n} sides."
