id: line-plots-eighths
kps:
  - id: line-plots-eighths.kp1
    explain: >-
      The marks between 0 and 1 are eighths. Count the Xs over a mark.
    templates:
      - id: line-plots-eighths.kp1.t1
        vars:
          a: {int: [1, 4]}
          b: {int: [1, 4]}
          c: {int: [1, 4]}
          k: {int: [0, 2]}
          len: "pick(k, '3/8', '1/2', '7/8')"
        prompt: "Beads were measured in inches. How many beads are {len} inch long?"
        layout: figure
        figure: line-plot
        figure_args: {from: 0, to: 1, step: 1/8, marks: "join('3/8:', text(a), '|1/2:', text(b), '|7/8:', text(c))"}
        answer: {type: integer, value: "pick(k, a, b, c)"}
        solution:
          - "Count the Xs over {len}."
          - "{pick(k, a, b, c)} {plural(pick(k, a, b, c), 'bead is', 'beads are')} {len} inch long."
  - id: line-plots-eighths.kp2
    explain: >-
      To compare two lengths on the plot, take one fraction from the other.
    templates:
      - id: line-plots-eighths.kp2.t1
        vars:
          a: {int: [1, 3]}
          b: {int: [1, 3]}
          lo: {int: [1, 3]}
          hi: {int: [5, 7]}
        prompt: "How much longer, in inches, is the longest bead than the shortest?"
        layout: figure
        figure: line-plot
        figure_args: {from: 0, to: 1, step: 1/8, marks: "join(text(lo), '/8:', text(a), '|', text(hi), '/8:', text(b))"}
        answer: {type: fraction, value: (hi - lo) / 8, simplest: false}
        solution:
          - "Longest {hi}/8, shortest {lo}/8."
          - "{hi}/8 − {lo}/8 = {hi - lo}/8"
