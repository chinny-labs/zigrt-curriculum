id: compose-flat-shapes
kps:
  - id: compose-flat-shapes.kp1
    explain: >-
      Shapes can be put together to make new shapes.
    templates:
      - id: compose-flat-shapes.kp1.t1
        vars:
          k: {int: [0, 4]}
          what: "pick(k, 'a hexagon from triangles', 'a square from two-by-two small squares', 'a hexagon from trapezoids', 'a circle from quarter circles', 'a rhombus from equal triangles')"
          n: "pick(k, 6, 4, 2, 4, 2)"
        prompt: "How many pieces make {what}?"
        answer: {type: integer, value: n}
        min_variety: 5
        solution:
          - "It takes {n} pieces to make {what}."
  - id: compose-flat-shapes.kp2
    explain: >-
      Two halves of a shape make the whole shape.
    templates:
      - id: compose-flat-shapes.kp2.t1
        vars:
          k: {int: [0, 2]}
          half: "pick(k, 'half circles', 'triangles cut from a square', 'small rectangles cut from a square')"
          whole: "pick(k, 'circle', 'square', 'square')"
        prompt: "Two {half} fit together. What shape do they make?"
        answer:
          type: choice
          right: "{whole}"
          distractors: ["{whole == 'circle' ? 'square' : 'circle'}", "triangle"]
        min_variety: 3
        solution:
          - "Two {half} make a {whole}."
