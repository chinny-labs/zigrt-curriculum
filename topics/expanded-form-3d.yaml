id: expanded-form-3d
kps:
  - id: expanded-form-3d.kp1
    explain: >-
      Write a number as its parts: hundreds plus tens plus ones.
    templates:
      - id: expanded-form-3d.kp1.t1
        vars:
          h: {int: [1, 9]}
          t: {int: [1, 9]}
          o: {int: [1, 9]}
          n: 100 * h + 10 * t + o
        prompt: "{n} = ? + {10 * t} + {o}"
        answer: {type: integer, value: 100 * h}
        solution:
          - "{n} has {h} hundreds. That is {100 * h}."
          - "{n} = {100 * h} + {10 * t} + {o}"
  - id: expanded-form-3d.kp2
    explain: >-
      Put the parts back together to write the number.
    templates:
      - id: expanded-form-3d.kp2.t1
        vars:
          h: {int: [1, 9]}
          t: {int: [0, 9]}
          o: {int: [0, 9]}
        prompt: "What number is {100 * h} + {10 * t} + {o}?"
        answer:
          type: choice
          right: "{100 * h + 10 * t + o}"
          distractors: ["{h}{10 * t}{o}", "{100 * h + 10 * o + t}"]
        solution:
          - "{h} hundreds, {t} tens and {o} ones."
          - "The number is {100 * h + 10 * t + o}."
