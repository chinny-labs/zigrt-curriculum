id: div-4d-2d
kps:
  - id: div-4d-2d.kp1
    explain: >-
      Four digits take more steps. Check each step: what you take away must be smaller than the divisor.
    templates:
      - id: div-4d-2d.kp1.t1
        vars:
          d: {int: [12, 75]}
          q: {int: [30, 400]}
          r: {int: [0, d - 1]}
          n: d * q + r
        where: ["n >= 1000 && n <= 9999"]
        prompt: "{n} ÷ {d}"
        layout: long-division
        parts: [n, d]
        answer: {type: quotient_remainder, value: q, remainder: r}
        solution:
          - "{d} × {q} = {group(d * q)}, and {group(n)} − {group(d * q)} = {r}."
          - "{group(n)} ÷ {d} = {q} r {r}"
