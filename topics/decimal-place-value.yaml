id: decimal-place-value
kps:
  - id: decimal-place-value.kp1
    explain: >-
      After the point come tenths, hundredths, then thousandths. Each place is a tenth of the one before.
    templates:
      - id: decimal-place-value.kp1.t1
        vars:
          n: {int: [1001, 9999]}
          x: n / 1000
          k: {int: [0, 2]}
          place: "pick(k, 'tenths', 'hundredths', 'thousandths')"
          d: "digit(x, pick(k, 0.1, 0.01, 0.001))"
        prompt: "What digit is in the {place} place of {dec(x, 3)}?"
        answer: {type: integer, value: d}
        solution:
          - "After the point: tenths, hundredths, thousandths."
          - "The {place} digit is {d}."
  - id: decimal-place-value.kp2
    explain: >-
      A digit's value is the digit times its place. A 7 in the hundredths place is worth 0.07.
    templates:
      - id: decimal-place-value.kp2.t1
        vars:
          n: {int: [1001, 9999]}
          x: n / 1000
          k: {int: [0, 2]}
          p: "pick(k, 1/10, 1/100, 1/1000)"
          d: "digit(x, p)"
        where: ["d != 0"]
        prompt: "In {dec(x, 3)}, what is the {d} in the {pick(k, 'tenths', 'hundredths', 'thousandths')} place worth?"
        answer:
          type: choice
          right: "{dec(d * p)}"
          distractors: ["{d}", "{dec(d * p * 10)}", "{dec(d * p / 10)}"]
        solution:
          - "{d} × {dec(p)} = {dec(d * p)}"
