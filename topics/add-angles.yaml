id: add-angles
kps:
  - id: add-angles.kp1
    explain: >-
      Angles side by side add up. The whole angle is the sum of the parts.
    templates:
      - id: add-angles.kp1.t1
        vars:
          a: {int: [15, 80]}
          b: {int: [15, 80]}
        prompt: "What is the whole angle, in degrees?"
        layout: figure
        figure: angle
        figure_args: {a: a, b: b, turn: 0, labels: "join(text(a), '°|', text(b), '°')"}
        answer: {type: integer, value: a + b}
        solution:
          - "{a}° + {b}° = {a + b}°"
