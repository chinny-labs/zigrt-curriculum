id: classify-quadrilaterals
kps:
  - id: classify-quadrilaterals.kp1
    explain: >-
      Sort quadrilaterals by parallel sides and right angles. A trapezoid has one pair of parallel sides.
    templates:
      - id: classify-quadrilaterals.kp1.t1
        vars:
          k: {int: [0, 4]}
          name: "pick(k, 'square', 'rectangle', 'rhombus', 'parallelogram', 'trapezoid')"
          fact: "pick(k, '2 pairs of parallel sides and 4 right angles, all sides equal', '2 pairs of parallel sides and 4 right angles', '2 pairs of parallel sides, all sides equal, no right angles', '2 pairs of parallel sides, no right angles', 'exactly 1 pair of parallel sides')"
        prompt: "Which shape has {fact}?"
        answer:
          type: choice
          right: "{name}"
          distractors: ["{pick(k, 'rhombus', 'square', 'parallelogram', 'trapezoid', 'parallelogram')}", "{pick(k, 'rectangle', 'parallelogram', 'square', 'rectangle', 'rhombus')}"]
        min_variety: 5
        solution:
          - "A {name} has {fact}."
