id: convert-customary-length
kps:
  - id: convert-customary-length.kp1
    explain: >-
      1 foot = 12 inches and 1 yard = 3 feet. To get the smaller unit, multiply.
    templates:
      - id: convert-customary-length.kp1.t1
        vars:
          n: {int: [2, 12]}
          k: {int: [0, 1]}
          big: "pick(k, 'feet', 'yards')"
          small: "pick(k, 'inches', 'feet')"
          f: "pick(k, 12, 3)"
        prompt: "{n} {big} = ? {small}"
        answer: {type: integer, value: n * f}
        min_variety: 22
        solution:
          - "Each of the {big} is {f} {small}."
          - "{n} × {f} = {n * f} {small}"
  - id: convert-customary-length.kp2
    explain: >-
      Some lengths mix units. 3 feet 5 inches is 36 + 5 inches.
    templates:
      - id: convert-customary-length.kp2.t1
        vars:
          ft: {int: [2, 8]}
          i: {int: [1, 11]}
        prompt: "{ft} feet {i} inches = ? inches"
        answer: {type: integer, value: 12 * ft + i}
        solution:
          - "{ft} feet = {12 * ft} inches."
          - "{12 * ft} + {i} = {12 * ft + i} inches"
