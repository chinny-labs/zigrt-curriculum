id: sub-3d-regroup
kps:
  - id: sub-3d-regroup.kp1
    explain: >-
      Not enough tens? Break a hundred into 10 tens.
    templates:
      - id: sub-3d-regroup.kp1.t1
        vars:
          a: {int: [300, 999]}
          b: {int: [100, 299]}
        where: ["a % 10 >= b % 10", "(a // 10) % 10 < (b // 10) % 10", "a // 100 > b // 100"]
        prompt: "{a} − {b}"
        layout: stacked
        op: "-"
        parts: [a, b]
        answer: {type: integer, value: a - b}
        solution:
          - "Break a hundred: the tens become {(a // 10) % 10 + 10}."
          - "Tens: {(a // 10) % 10 + 10} − {(b // 10) % 10} = {(a // 10) % 10 + 10 - (b // 10) % 10}."
          - "{a} − {b} = {a - b}"
  - id: sub-3d-regroup.kp2
    explain: >-
      Sometimes you break a ten and a hundred. Work from the ones.
    templates:
      - id: sub-3d-regroup.kp2.t1
        vars:
          a: {int: [300, 999]}
          b: {int: [100, 299]}
        where: ["a % 10 < b % 10", "(a // 10) % 10 - 1 < (b // 10) % 10", "a // 100 > b // 100"]
        prompt: "{a} − {b}"
        layout: stacked
        op: "-"
        parts: [a, b]
        answer:
          type: choice
          right: "{a - b}"
          distractors: ["{a - b + 10}", "{a - b + 100}", "{a - b + 110}"]
        solution:
          - "Ones: break a ten, {a % 10 + 10} − {b % 10} = {a % 10 + 10 - b % 10}."
          - "Tens: break a hundred, {(a // 10) % 10 - 1 + 10} − {(b // 10) % 10} = {(a // 10) % 10 + 9 - (b // 10) % 10}."
          - "{a} − {b} = {a - b}"
