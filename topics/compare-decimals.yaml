id: compare-decimals
kps:
  - id: compare-decimals.kp1
    explain: >-
      Line up the decimal points. Compare the digits from the left, one
      place at a time.
    templates:
      - id: compare-decimals.kp1.t1
        vars:
          a: {int: [1, 99]}
          b: {int: [1, 99]}
          sym: "a < b ? '<' : (a > b ? '>' : '=')"
        where:
          - a % 10 != 0 && b % 10 != 0
        prompt: "{dec(a / 10)} ○ {dec(b / 10)}"
        answer: {type: comparison, compare: ["a / 10", "b / 10"]}
        solution:
          - "Compare the ones first, then the tenths."
          - "{dec(a / 10)} {sym} {dec(b / 10)}"
  - id: compare-decimals.kp2
    explain: >-
      A longer decimal is not always bigger. Add a zero so both have the
      same number of places, then compare.
    templates:
      - id: compare-decimals.kp2.t1
        vars:
          a: {int: [1, 9]}
          b: {int: [1, 99]}
          sym: "a * 10 < b ? '<' : (a * 10 > b ? '>' : '=')"
        where:
          - b % 10 != 0
        prompt: "{dec(a / 10)} ○ {dec(b / 100)}"
        answer: {type: comparison, compare: ["a / 10", "b / 100"]}
        solution:
          - "Write {dec(a / 10)} as {dec(a / 10, 2)} so both have two places."
          - "{a * 10} hundredths {sym} {b} hundredths."
          - "{dec(a / 10)} {sym} {dec(b / 100)}"
