id: add-3d
kps:
  - id: add-3d.kp1
    explain: >-
      Line up hundreds, tens and ones. Add each place, starting with the ones.
    templates:
      - id: add-3d.kp1.t1
        vars:
          a: {int: [100, 799]}
          b: {int: [100, 199]}
        where: ["a % 10 + b % 10 <= 9", "(a // 10) % 10 + (b // 10) % 10 <= 9", "a + b <= 999"]
        prompt: "{a} + {b}"
        layout: stacked
        op: "+"
        parts: [a, b]
        answer: {type: integer, value: a + b}
        solution:
          - "Ones {a % 10 + b % 10}, tens {(a // 10) % 10 + (b // 10) % 10}, hundreds {a // 100 + b // 100}."
          - "{a} + {b} = {a + b}"
  - id: add-3d.kp2
    explain: >-
      If the ones make 10 or more, carry a ten to the tens.
    templates:
      - id: add-3d.kp2.t1
        vars:
          a: {int: [100, 799]}
          b: {int: [100, 199]}
        where: ["a % 10 + b % 10 >= 10", "(a // 10) % 10 + (b // 10) % 10 <= 8", "a + b <= 999"]
        prompt: "{a} + {b}"
        layout: stacked
        op: "+"
        parts: [a, b]
        answer: {type: integer, value: a + b}
        solution:
          - "Ones: {a % 10} + {b % 10} = {a % 10 + b % 10}. Write {(a + b) % 10}, carry 1."
          - "Tens: {(a // 10) % 10} + {(b // 10) % 10} + 1 = {(a // 10) % 10 + (b // 10) % 10 + 1}."
          - "{a} + {b} = {a + b}"
